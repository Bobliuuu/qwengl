<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" role="img"><style>
:root{--bg:#fbfbfd;--panel:#ffffff;--soft:#eef0f9;--ink:#14172b;--mute:#5a6285;--line:#c9cde3;--teal:#0f9d8a;--violet:#6246ea;--amber:#c97a0a;--rose:#d1385c;--vfill:#ece8ff;--tfill:#dcf5f0;--afill:#fff0d6;--rfill:#ffe3ea}
@media (prefers-color-scheme:dark){:root{--bg:#0b0e1a;--panel:#12172b;--soft:#171d36;--ink:#e6e9ff;--mute:#9aa4cf;--line:#2b3252;--teal:#35d6c0;--violet:#9d86ff;--amber:#ffb454;--rose:#ff6b8b;--vfill:#1d1a3d;--tfill:#10312f;--afill:#33260f;--rfill:#3a1824}}
text{font-family:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;fill:var(--ink)}
.m{fill:var(--mute)}.b{font-weight:700}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre}
.flow{stroke-dasharray:7 6;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-13}}
.pulse{animation:pl 2.4s ease-in-out infinite}@keyframes pl{50%{opacity:.45}}
.rise{animation:rs 3.2s ease-in-out infinite}@keyframes rs{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.flow,.pulse,.rise{animation:none}}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--mute)"/></marker></defs><rect width="1200" height="300" rx="18" fill="var(--bg)"/><text x="40" y="40" font-size="22" class="b" text-anchor="start">Measured: A100, Qwen3.5-0.8B, 36 frames</text><rect x="30" y="80" width="214" height="150" rx="12" fill="var(--tfill)" stroke="var(--teal)" stroke-width="2" class=""/><text x="137.0" y="105" font-size="23" class="b" text-anchor="middle" fill="var(--teal)">104,940</text><text x="137.0" y="127" font-size="20" class="m" text-anchor="middle">kernel runs</text><text x="137.0" y="144" font-size="20" class="m" text-anchor="middle">27,880 unique</text><rect x="260" y="80" width="214" height="150" rx="12" fill="var(--vfill)" stroke="var(--violet)" stroke-width="2" class=""/><text x="367.0" y="105" font-size="23" class="b" text-anchor="middle" fill="var(--violet)">31.2 M</text><text x="367.0" y="127" font-size="20" class="m" text-anchor="middle">tokens through the model</text><text x="367.0" y="144" font-size="20" class="m" text-anchor="middle">1.81 M predicted positions</text><rect x="490" y="80" width="214" height="150" rx="12" fill="var(--afill)" stroke="var(--amber)" stroke-width="2" class=""/><text x="597.0" y="105" font-size="23" class="b" text-anchor="middle" fill="var(--amber)">0</text><text x="597.0" y="127" font-size="20" class="m" text-anchor="middle">mismatches</text><text x="597.0" y="144" font-size="20" class="m" text-anchor="middle">model argmax vs integer oracle</text><rect x="720" y="80" width="214" height="150" rx="12" fill="var(--tfill)" stroke="var(--teal)" stroke-width="2" class=""/><text x="827.0" y="105" font-size="23" class="b" text-anchor="middle" fill="var(--teal)">36 / 36</text><text x="827.0" y="127" font-size="20" class="m" text-anchor="middle">frames pixel-identical</text><text x="827.0" y="144" font-size="20" class="m" text-anchor="middle">to the numpy pipeline</text><rect x="950" y="80" width="214" height="150" rx="12" fill="var(--rfill)" stroke="var(--rose)" stroke-width="2" class=""/><text x="1057.0" y="105" font-size="23" class="b" text-anchor="middle" fill="var(--rose)">123 s</text><text x="1057.0" y="127" font-size="20" class="m" text-anchor="middle">one frame, free-running</text><text x="1057.0" y="144" font-size="20" class="m" text-anchor="middle">56,747 tokens, 0 mismatches</text><text x="40" y="268" font-size="13" class="m" text-anchor="start">teacher-forced on the 36 frames, true autoregressive generation on one full frame. Raw logs are in results/.</text></svg>