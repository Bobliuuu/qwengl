<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" role="img"><style>
:root{--bg:#fbfbfd;--panel:#ffffff;--soft:#eef0f9;--ink:#14172b;--mute:#5a6285;--line:#c9cde3;--teal:#0f9d8a;--violet:#6246ea;--amber:#c97a0a;--rose:#d1385c;--vfill:#ece8ff;--tfill:#dcf5f0;--afill:#fff0d6;--rfill:#ffe3ea}
@media (prefers-color-scheme:dark){:root{--bg:#0b0e1a;--panel:#12172b;--soft:#171d36;--ink:#e6e9ff;--mute:#9aa4cf;--line:#2b3252;--teal:#35d6c0;--violet:#9d86ff;--amber:#ffb454;--rose:#ff6b8b;--vfill:#1d1a3d;--tfill:#10312f;--afill:#33260f;--rfill:#3a1824}}
text{font-family:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;fill:var(--ink)}
.m{fill:var(--mute)}.b{font-weight:700}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre}
.flow{stroke-dasharray:7 6;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-13}}
.pulse{animation:pl 2.4s ease-in-out infinite}@keyframes pl{50%{opacity:.45}}
.rise{animation:rs 3.2s ease-in-out infinite}@keyframes rs{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.flow,.pulse,.rise{animation:none}}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--mute)"/></marker></defs><rect width="1200" height="440" rx="18" fill="var(--bg)"/><text x="40" y="40" font-size="22" class="b" text-anchor="start">Edge functions without a multiplier: the rotation does the work</text><text x="40" y="62" font-size="13" class="m" text-anchor="start">Triangle setup folds into edge evaluation. Pixel position is the weight, the vertex data is the activation.</text><rect x="40" y="100" width="520" height="120" rx="12" fill="var(--vfill)" stroke="var(--violet)" stroke-width="2" class=""/><text x="300.0" y="125" font-size="15" class="b" text-anchor="middle" fill="var(--violet)">edge e(q) of directed cube edge a → b</text><text x="300.0" y="147" font-size="12" class="m" text-anchor="middle">e(q) = A·qx + B·qy + C</text><text x="300.0" y="164" font-size="12" class="m" text-anchor="middle">A = Ya − Yb      B = Xb − Xa</text><text x="300.0" y="181" font-size="12" class="m" text-anchor="middle">C = Xa·Yb − Xb·Ya</text><rect x="640" y="100" width="520" height="120" rx="12" fill="var(--tfill)" stroke="var(--teal)" stroke-width="2" class=""/><text x="900.0" y="125" font-size="15" class="b" text-anchor="middle" fill="var(--teal)">Binet–Cauchy turns the product into a dot</text><text x="900.0" y="147" font-size="12" class="m" text-anchor="middle">C = m · (s_a × s_b)</text><text x="900.0" y="164" font-size="12" class="m" text-anchor="middle">m = Rx × Ry   (3 ints, a host uniform)</text><text x="900.0" y="181" font-size="12" class="m" text-anchor="middle">s_a × s_b ∈ {0, ±2}  →  a 5-bit weight</text><line x1="562" y1="160" x2="636" y2="160" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><text x="40" y="262" font-size="14" class="b" text-anchor="start">So for 6 pixels (qx, qy are the WEIGHTS), one run computes:</text><text x="60" y="290" font-size="13" class="mono" text-anchor="start">e = qx·(Ya − Yb) + qy·(Xb − Xa) + 2·(±m₀ ± m₁ ± m₂)      lanes: Xa Xb Ya Yb m₀± m₁± m₂±   (10)</text><text x="60" y="318" font-size="13" class="mono" text-anchor="start">out lane 2p   = 15·relu(e + 1)   ≈  [e ≥ 0]        out lane 2p+1 = 15·relu(1 − e)   ≈  [e ≤ 0]</text><text x="40" y="362" font-size="13" class="m" text-anchor="start">Both windings are tested (e ≥ 0 for CCW, e ≤ 0 for CW), so faces need no culling and the depth buffer has real work to do.</text><text x="40" y="386" font-size="13" class="m" text-anchor="start">Exactness: A, B come from the vertex kernel&#x27;s own outputs, C from the identity, so every edge passes through its two vertices to the pixel.</text><text x="40" y="410" font-size="13" class="m" text-anchor="start">Checked against an independent integer rasteriser on 30 random rotations: 0 differing pixels.</text></svg>