<text x="30" y="44" fill="#e6edf3" font-size="22" font-weight="700">one frame = a chain of tiny integer programs, each run by Qwen3.5</text>
<text x="30" y="70" fill="#8b93a7" font-size="14">every box = y = clip(relu(x·W + b), 0, 31) · 5-bit weights · ≤ 15 lanes · depth ≤ 2 (one qwenTPU v2 program)</text>
