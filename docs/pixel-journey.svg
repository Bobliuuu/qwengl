class="b" text-anchor="middle" fill="var(--teal)">cov 31</text><line x1="528" y1="404" x2="556" y2="404" stroke="var(--rose)" stroke-width="2" class="flow" marker-end="url(#ar)"/><text x="568" y="392" font-size="14" class="mono" text-anchor="start">zn = 10   Z = 4</text><text x="568" y="416" font-size="14" class="b" text-anchor="start" fill="var(--rose)">zn ≥ Z  →  rejected, buffers unchanged</text><text x="568" y="440" font-size="12" class="mono m" text-anchor="start">g = 0   (Z′ = Z − g)</text><text x="930" y="392" font-size="15" class="mono b" text-anchor="start">Z : 4 → 4</text><rect x="930" y="408" width="40" height="26" rx="6" fill="#f9e745"/><text x="980" y="426" font-size="16" class="b" text-anchor="start">→</text><rect x="1000" y="408" width="40" height="26" rx="6" fill="#f9e745"/><text x="1050" y="426" font-size="12" class="mono m" text-anchor="start">15 → 15</text><rect x="30" y="472" width="1140" height="104" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"/><text x="50" y="502" font-size="15" class="b" text-anchor="start">triangle 11</text><text x="50" y="524" font-size="12" class="m" text-anchor="start">face 5</text><rect x="50" y="534" width="60" height="24" rx="6" fill="#5c2177"/><text x="120" y="551" font-size="12" class="mono m" text-anchor="start">colour 27</text><rect x="190" y="492" width="68" height="28" rx="7" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.6"/><text x="224" y="511" font-size="12" class="mono" text-anchor="middle">≥0  15</text><rect x="190" y="528" width="68" height="28" rx="7" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.6"/><text x="224" y="547" font-size="12" class="mono" text-anchor="middle">≤0  15</text><rect x="270" y="492" width="68" height="28" rx="7" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.6"/><text x="304" y="511" font-size="12" class="mono" text-anchor="middle">≥0  31</text><rect x="270" y="528" width="68" height="28" rx="7" fill="var(--soft)" stroke="var(--line)" stroke-width="1.6"/><text x="304" y="547" font-size="12" class="mono" text-anchor="middle">≤0  0</text><rect x="350" y="492" width="68" height="28" rx="7" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.6"/><text x="384" y="511" font-size="12" class="mono" text-anchor="middle">≥0  15</text><rect x="350" y="528" width="68" height="28" rx="7" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.6"/><text x="384" y="547" font-size="12" class="mono" text-anchor="middle">≤0  15</text><rect x="430" y="498" width="96" height="52" rx="10" fill="var(--tfill)" stroke="var(--teal)" stroke-width="2"/><text x="478" y="531" font-size="14" class="b" text-anchor="middle" fill="var(--teal)">cov 31</text><line x1="528" y1="524" x2="556" y2="524" stroke="var(--rose)" stroke-width="2" class="flow" marker-end="url(#ar)"/><text x="568" y="512" font-size="14" class="mono" text-anchor="start">zn = 10   Z = 4</text><text x="568" y="536" font-size="14" class="b" text-anchor="start" fill="var(--rose)">zn ≥ Z  →  rejected, buffers unchanged</text><text x="568" y="560" font-size="12" class="mono m" text-anchor="start">g = 0   (Z′ = Z − g)</text><text x="930" y="512" font-size="15" class="mono b" text-anchor="start">Z : 4 → 4</text><rect x="930" y="528" width="40" height="26" rx="6" fill="#f9e745"/><text x="980" y="546" font-size="16" class="b" text-anchor="start">→</text><rect x="1000" y="528" width="40" height="26" rx="6" fill="#f9e745"/><text x="1050" y="546" font-size="12" class="mono m" text-anchor="start">15 → 15</text><text x="40" y="622" font-size="13" class="m" text-anchor="start">The last two triangles are the two halves of the same far face. They are covered, but the near face already won, so nothing is written.</text><text x="40" y="646" font-size="13" class="m" text-anchor="start">No branch, no comparison instruction: g = relu(Z − zn + s31 + cov − 62), then Z′ = relu(Z − g). It is all gated ReLU.</text></svg>