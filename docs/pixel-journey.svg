<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" width="100%" role="img"><style>
:root{--bg:#fbfbfd;--panel:#ffffff;--soft:#eef0f9;--ink:#14172b;--mute:#5a6285;--line:#c9cde3;--teal:#0f9d8a;--violet:#6246ea;--amber:#c97a0a;--rose:#d1385c;--vfill:#ece8ff;--tfill:#dcf5f0;--afill:#fff0d6;--rfill:#ffe3ea}
@media (prefers-color-scheme:dark){:root{--bg:#0b0e1a;--panel:#12172b;--soft:#171d36;--ink:#e6e9ff;--mute:#9aa4cf;--line:#2b3252;--teal:#35d6c0;--violet:#9d86ff;--amber:#ffb454;--rose:#ff6b8b;--vfill:#1d1a3d;--tfill:#10312f;--afill:#33260f;--rfill:#3a1824}}
text{font-family:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;fill:var(--ink)}
.m{fill:var(--mute)}.b{font-weight:700}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre}
.flow{stroke-dasharray:7 6;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-13}}
.pulse{animation:pl 2.4s ease-in-out infinite}@keyframes pl{50%{opacity:.45}}
.rise{animation:rs 3.2s ease-in-out infinite}@keyframes rs{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.flow,.pulse,.rise{animation:none}}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--mute)"/></marker></defs><rect width="1200" height="710" rx="18" fill="var(--bg)"/><text x="40" y="40" font-size="22" class="b" text-anchor="start">Life of a pixel: (12, 7) through four triangles</text><text x="40" y="62" font-size="13" class="m" text-anchor="start">Real kernel values from the demo frame. Four triangles cover this pixel. The depth test decides who wins.</text><text x="40" y="98" font-size="12" class="b" text-anchor="start" fill="var(--mute)">edge steps (e ≥ 0 / e ≤ 0)</text><text x="430" y="98" font-size="12" class="b" text-anchor="start" fill="var(--mute)">coverage</text><text x="560" y="98" font-size="12" class="b" text-anchor="start" fill="var(--mute)">depth test:  Z − zn ≥ 1 ?</text><text x="930" y="98" font-size="12" class="b" text-anchor="start" fill="var(--mute)">Z buffer / colour</text><rect x="30" y="112" width="1140" height="104" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"/><text x="50" y="142" font-size="15" class="b" text-anchor="start">triangle 1</text><text x="50" y="164" font-size="12" class="m" text-anchor="start">face 0</text><rect x="50" y="174" width="60" height="24" rx="6" fill="#a32d2d"/><text x="120" y="191" font-size="12" class="mono m" text-anchor="start">colour 3</text><rect x="190" y="132" width="68" height="28" rx="7" fill="var(--soft)" stroke="var(--line)" stroke-width="1.6"/><text x="224" y="151" font-size="12" class="mono" text-anchor="middle">≥0  0</text><rect x="190" y="168" width="68" height="28" rx="7" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.6"/><text x="224" y="187" font-size="12" class="mono" text-anchor="middle">≤0  31</text><rect x="270" y="132" width="68" height="28" rx="7" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.6"/><text x="304" y="151" font-size="12" class="mono" text-anchor="middle">≥0  15</text><rect x="270" y="168" width="68" height="28" rx="7" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.6"/><text x="304" y="187" font-size="12" class="mono" text-anchor="middle">≤0  15</text><rect x="350" y="132" width="68" height="28" rx="7" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.6"/><text x="384" y="151" font-size="12" class="mono" text-anchor="middle">≥0  15</text><rect x="350" y="168" width="68" height="28" rx="7" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.6"/><text x="384" y="187" font-size="12" class="mono" text-anchor="middle">≤0  15</text><rect x="430" y="138" width="96" height="52" rx="10" fill="var(--tfill)" stroke="var(--teal)" stroke-width="2"/><text x="478" y="171" font-size="14" class="b" text-anchor="middle" fill="var(--teal)">cov 31</text><line x1="528" y1="164" x2="556" y2="164" stroke="var(--teal)" stroke-width="2" class="flow" marker-end="url(#ar)"/><text x="568" y="152" font-size="14" class="mono" text-anchor="start">zn = 10   Z = 31</text><text x="568" y="176" font-size="14" class="b" text-anchor="start" fill="var(--teal)">zn &lt; Z  →  WRITE</text><text x="568" y="200" font-size="12" class="mono m" text-anchor="start">g = 21   (Z′ = Z − g)</text><text x="930" y="152" font-size="15" class="mono b" text-anchor="start">Z : 31 → 10</text><rect x="930" y="168" width="40" height="26" rx="6" fill="#0e1018"/><text x="980" y="186" font-size="16" class="b" text-anchor="start">→</text><rect x="1000" y="168" width="40" height="26" rx="6" fill="#a32d2d"/><text x="1050" y="186" font-size="12" class="mono m" text-anchor="start">0 → 3</text><rect x="30" y="232" width="1140" height="104" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"/><text x="50" y="262" font-size="15" class="b" text-anchor="start">triangle 5</text><text x="50" y="284" font-size="12" class="m" text-anchor="start">face 2</text><rect x="50" y="294" width="60" height="24" rx="6" fill="#f9e745"/><text x="120" y="311" font-size="12" class="mono 