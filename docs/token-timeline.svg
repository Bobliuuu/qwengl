<text x="713" y="407" font-size="10.5" class="mono" text-anchor="middle">OUT 3 = 0</text><rect x="768" y="386" width="98" height="32" rx="7" fill="var(--vfill)" stroke="var(--violet)" stroke-width="1.6"/><text x="817" y="407" font-size="10.5" class="mono" text-anchor="middle">READ 20</text><rect x="872" y="386" width="98" height="32" rx="7" fill="var(--rfill)" stroke="var(--rose)" stroke-width="1.6"/><text x="921" y="407" font-size="10.5" class="mono" text-anchor="middle">OUT 4 = 0</text><rect x="976" y="386" width="98" height="32" rx="7" fill="var(--vfill)" stroke="var(--violet)" stroke-width="1.6"/><text x="1025" y="407" font-size="10.5" class="mono" text-anchor="middle">READ 21</text><rect x="1080" y="386" width="98" height="32" rx="7" fill="var(--rfill)" stroke="var(--rose)" stroke-width="1.6"/><text x="1129" y="407" font-size="10.5" class="mono" text-anchor="middle">OUT 5 = 0</text><text x="40" y="444" font-size="13" class="m" text-anchor="start">layer 1:  READ k, then the model emits ACT(row; y): the next layer&#x27;s input row, written by the model itself.</text><text x="40" y="468" font-size="13" class="m" text-anchor="start">layer 2:  READ k, then OUT j = y: the result tokens.   Last token: HALT.   Total emitted: 65.</text><text x="40" y="504" font-size="12" class="b" text-anchor="start">legend:</text><rect x="100" y="493" width="14" height="14" rx="3" fill="var(--vfill)" stroke="var(--violet)"/><text x="120" y="505" font-size="12" class="m" text-anchor="start">READ (control)</text><rect x="240" y="493" width="14" height="14" rx="3" fill="var(--tfill)" stroke="var(--teal)"/><text x="260" y="505" font-size="12" class="m" text-anchor="start">ACT (layer 1 → 2)</text><rect x="400" y="493" width="14" height="14" rx="3" fill="var(--rfill)" stroke="var(--rose)"/><text x="420" y="505" font-size="12" class="m" text-anchor="start">OUT (result)</text><rect x="530" y="493" width="14" height="14" rx="3" fill="var(--afill)" stroke="var(--amber)"/><text x="550" y="505" fo