<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="100%" role="img"><style>
:root{--bg:#fbfbfd;--panel:#ffffff;--soft:#eef0f9;--ink:#14172b;--mute:#5a6285;--line:#c9cde3;--teal:#0f9d8a;--violet:#6246ea;--amber:#c97a0a;--rose:#d1385c;--vfill:#ece8ff;--tfill:#dcf5f0;--afill:#fff0d6;--rfill:#ffe3ea}
@media (prefers-color-scheme:dark){:root{--bg:#0b0e1a;--panel:#12172b;--soft:#171d36;--ink:#e6e9ff;--mute:#9aa4cf;--line:#2b3252;--teal:#35d6c0;--violet:#9d86ff;--amber:#ffb454;--rose:#ff6b8b;--vfill:#1d1a3d;--tfill:#10312f;--afill:#33260f;--rfill:#3a1824}}
text{font-family:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;fill:var(--ink)}
.m{fill:var(--mute)}.b{font-weight:700}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre}
.flow{stroke-dasharray:7 6;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-13}}
.pulse{animation:pl 2.4s ease-in-out infinite}@keyframes pl{50%{opacity:.45}}
.rise{animation:rs 3.2s ease-in-out infinite}@keyframes rs{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.flow,.pulse,.rise{animation:none}}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--mute)"/></marker></defs><rect width="1200" height="470" rx="18" fill="var(--bg)"/><text x="40" y="40" font-size="22" class="b" text-anchor="start">Anatomy of a kernel (depth 2, 15 lanes, 5-bit)</text><text x="40" y="62" font-size="13" class="m" text-anchor="start">Every stage in the pipeline has exactly this shape. Hardware limits are enforced when the kernel is built.</text><text x="96" y="96" font-size="12.5" class="b" text-anchor="middle" fill="var(--amber)">input lanes</text><rect x="60" y="110" width="72" height="14" rx="4" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.2"/><text x="96" y="121" font-size="10" class="mono" text-anchor="middle">0</text><rect x="60" y="127" width="72" height="14" rx="4" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.2"/><text x="96" y="138" font-size="10" class="mono" text-anchor="middle">15</text><rect x="60" y="144" width="72" height="14" rx="4" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.2"/><text x="96" y="155" font-size="10" class="mono" text-anchor="middle">15</text><rect x="60" y="161" width="72" height="14" rx="4" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.2"/><text x="96" y="172" font-size="10" class="mono" text-anchor="middle">31</text><rect x="60" y="178" width="72" height="14" rx="4" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.2"/><text x="96" y="189" font-size="10" class="mono" text-anchor="middle">15</text><rect x="60" y="195" width="72" height="14" rx="4" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.2"/><text x="96" y="206" font-size="10" class="mono" text-anchor="middle">15</text><rect x="60" y="212" width="72" height="14" rx="4" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.2"/><text x="96" y="223" font-size="10" class="mono" text-anchor="middle">0</text><rect x="60" y="229" width="72" height="14" rx="4" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.2"/><text x="96" y="240" font-size="10" class="mono" text-anchor="middle">0</text><rect x="60" y="246" width="72" height="14" rx="4" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.2"/><text x="96" y="257" font-size="10" class="mono" text-anchor="middle">0</text><rect x="60" y="263" width="72" height="14" rx="4" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.2"/><text x="96" y="274" font-size="10" class="mono" text-anchor="middle">0</text><rect x="60" y="280" width="72" height="14" rx="4" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.2"/><text x="96" y="291" font-size="10" class="mono" text-anchor="middle">0</text><rect x="60" y="297" width="72" height="14" rx="4" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.2"/><text x="96" y="308" font-size="10" class="mono" text-anchor="middle">0</text><rect x="60" y="314" width="72" height="14" rx="4" fill="var(--soft)" stroke="var(--line)"/><text x="96" y="325" font-size="10" class="mono" text-anchor="middle">bias = 1</text><rect x="210" y="150" width="190" height="100" rx="12" fill="var(--vfill)" stroke="var(--violet)" stroke-width="2" class=""/><text x="305.0" y="175" font-size="15" class="b" text-anchor="middle" fill="var(--violet)">layer 1</text><text x="305.0" y="197" font-size="12" class="m" text-anchor="middle">x @ W₁ + b₁</text><text x="305.0" y="214" font-size="12" class="m" text-anchor="middle">relu, clamp 0..31</text><text x="305.0" y="231" font-size="12" class="m" text-anchor="middle">W ∈ [−16, 15]</text><text x="486" y="96" font-size="12.5" class="b" text-anchor="middle" fill="var(--teal)">13 lanes</text><rect x="450" y="110" width="72" height="14" rx="4" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.2"/><rect x="450" y="127" width="72" height="14" rx="4" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.2"/><rect x="450" y="144" width="72" height="14" rx="4" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.2"/><rect x="450" y="161" width="72" height="14" rx="4" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.2"/><rect x="450" y="178" width="72" height="14" rx="4" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.2"/><rect x="450" y="195" width="72" height="14" rx="4" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.2"/><rect x="450" y="212" width="72" height="14" rx="4" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.2"/><rect x="450" y="229" width="72" height="14" rx="4" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.2"/><rect x="450" y="246" width="72" height="14" rx="4" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.2"/><rect x="450" y="263" width="72" height="14" rx="4" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.2"/><rect x="450" y="280" width="72" height="14" rx="4" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.2"/><rect x="450" y="297" width="72" height="14" rx="4" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.2"/><rect x="450" y="314" width="72" height="14" rx="4" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.2"/><rect x="570" y="150" width="190" height="100" rx="12" fill="var(--vfill)" stroke="var(--violet)" stroke-width="2" class=""/><text x="665.0" y="175" font-size="15" class="b" text-anchor="middle" fill="var(--violet)">layer 2</text><text x="665.0" y="197" font-size="12" class="m" text-anchor="middle">x @ W₂ + b₂</text><text x="665.0" y="214" font-size="12" class="m" text-anchor="middle">relu, clamp 0..31</text><text x="665.0" y="231" font-size="12" class="m" text-anchor="middle">no shift, ever</text><text x="846" y="96" font-size="12.5" class="b" text-anchor="middle" fill="var(--rose)">output</text><rect x="810" y="110" width="72" height="14" rx="4" fill="var(--rfill)" stroke="var(--rose)" stroke-width="1.2"/><text x="846" y="121" font-size="10" class="mono" text-anchor="middle">0</text><rect x="810" y="127" width="72" height="14" rx="4" fill="var(--rfill)" stroke="var(--rose)" stroke-width="1.2"/><text x="846" y="138" font-size="10" class="mono" text-anchor="middle">31</text><rect x="810" y="144" width="72" height="14" rx="4" fill="var(--rfill)" stroke="var(--rose)" stroke-width="1.2"/><text x="846" y="155" font-size="10" class="mono" text-anchor="middle">0</text><rect x="810" y="161" width="72" height="14" rx="4" fill="var(--rfill)" stroke="var(--rose)" stroke-width="1.2"/><text x="846" y="172" font-size="10" class="mono" text-anchor="middle">0</text><line x1="136" y1="190" x2="206" y2="190" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><line x1="404" y1="190" x2="446" y2="190" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><line x1="522" y1="190" x2="566" y2="190" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><line x1="764" y1="190" x2="806" y2="190" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><text x="60" y="360" font-size="13" class="m" text-anchor="start">Why 15 lanes?  The array is 16 wide and one lane is the model&#x27;s constant 1 (the bias row). Lane 15 of every layer carries it.</text><text x="60" y="384" font-size="13" class="m" text-anchor="start">Why depth 2?  The validated 16-wide 5-bit chip is a 32×32 packed array: two 16-wide blocks. A deeper stage is just two programs back to back.</text><text x="60" y="408" font-size="13" class="m" text-anchor="start">Why 5-bit?  Bit-plane counts stay exact in bf16 only up to 5 bits; that is what makes the whole thing integer-exact on real hardware.</text><text x="60" y="440" font-size="12" class="m" text-anchor="start">values shown: the real input and output of the coverage kernel for pixel (12, 7) of the demo frame</text></svg>