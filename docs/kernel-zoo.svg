<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="100%" role="img"><style>
:root{--bg:#fbfbfd;--panel:#ffffff;--soft:#eef0f9;--ink:#14172b;--mute:#5a6285;--line:#c9cde3;--teal:#0f9d8a;--violet:#6246ea;--amber:#c97a0a;--rose:#d1385c;--vfill:#ece8ff;--tfill:#dcf5f0;--afill:#fff0d6;--rfill:#ffe3ea}
@media (prefers-color-scheme:dark){:root{--bg:#0b0e1a;--panel:#12172b;--soft:#171d36;--ink:#e6e9ff;--mute:#9aa4cf;--line:#2b3252;--teal:#35d6c0;--violet:#9d86ff;--amber:#ffb454;--rose:#ff6b8b;--vfill:#1d1a3d;--tfill:#10312f;--afill:#33260f;--rfill:#3a1824}}
text{font-family:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;fill:var(--ink)}
.m{fill:var(--mute)}.b{font-weight:700}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre}
.flow{stroke-dasharray:7 6;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-13}}
.pulse{animation:pl 2.4s ease-in-out infinite}@keyframes pl{50%{opacity:.45}}
.rise{animation:rs 3.2s ease-in-out infinite}@keyframes rs{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.flow,.pulse,.rise{animation:none}}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--mute)"/></marker></defs><rect width="1200" height="470" rx="18" fill="var(--bg)"/><text x="40" y="40" font-size="22" class="b" text-anchor="start">Kernel zoo: every stage, with its real shape</text><text x="40" y="62" font-size="13" class="m" text-anchor="start">Runs per frame are for the demo frame at angles (0.4, 0.7, 0.1).</text><text x="50" y="100" font-size="12" class="b" text-anchor="start">kernel</text><text x="210" y="100" font-size="12" class="b" text-anchor="start">what it does</text><text x="560" y="100" font-size="12" class="b" text-anchor="start">lanes in → out</text><text x="740" y="100" font-size="12" class="b" text-anchor="start">depth</text><text x="830" y="100" font-size="12" class="b" text-anchor="start">runs / frame</text><text x="1000" y="100" font-size="12" class="b" text-anchor="start">share of runs</text><rect x="30" y="116" width="1140" height="34" rx="9" fill="var(--panel)" stroke="var(--line)"/><text x="50" y="138" font-size="14" class="mono b" text-anchor="start">vertex</text><text x="210" y="138" font-size="13" class="m" text-anchor="start">corner signs × rotation row</text><text x="560" y="138" font-size="13" class="mono" text-anchor="start">6 → 8</text><text x="750" y="138" font-size="13" class="mono" text-anchor="start">1</text><text x="830" y="138" font-size="13" class="mono" text-anchor="start">3</text><rect x="1000" y="126" width="3" height="14" rx="4" fill="var(--violet)"/><rect x="30" y="156" width="1140" height="34" rx="9" fill="var(--panel)" stroke="var(--line)"/><text x="50" y="178" font-size="14" class="mono b" text-anchor="start">clip</text><text x="210" y="178" font-size="13" class="m" text-anchor="start">saturation flags</text><text x="560" y="178" font-size="13" class="mono" text-anchor="start">6 → 12</text><text x="750" y="178" font-size="13" class="mono" text-anchor="start">2</text><text x="830" y="178" font-size="13" class="mono" text-anchor="start">12</text><rect x="1000" y="166" width="3" height="14" rx="4" fill="var(--violet)"/><rect x="30" y="196" width="1140" height="34" rx="9" fill="var(--panel)" stroke="var(--line)"/><text x="50" y="218" font-size="14" class="mono b" text-anchor="start">clip_any</text><text x="210" y="218" font-size="13" class="m" text-anchor="start">any flag set?</text><text x="560" y="218" font-size="13" class="mono" text-anchor="start">12 → 1</text><text x="750" y="218" font-size="13" class="mono" text-anchor="start">1</text><text x="830" y="218" font-size="13" class="mono" text-anchor="start">12</text><rect x="1000" y="206" width="3" height="14" rx="4" fill="var(--violet)"/><rect x="30" y="236" width="1140" height="34" rx="9" fill="var(--panel)" stroke="var(--line)"/><text x="50" y="258" font-size="14" class="mono b" text-anchor="start">shade</text><text x="210" y="258" font-size="13" class="m" text-anchor="start">light · normal → colour, depth</text><text x="560" y="258" font-size="13" class="mono" text-anchor="start">6 → 2</text><text x="750" y="258" font-size="13" class="mono" text-anchor="start">2</text><text x="830" y="258" font-size="13" class="mono" text-anchor="start">6</text><rect x="1000" y="246" width="3" height="14" rx="4" fill="var(--violet)"/><rect x="30" y="276" width="1140" height="34" rx="9" fill="var(--panel)" stroke="var(--line)"/><text x="50" y="298" font-size="14" class="mono b" text-anchor="start">eval</text><text x="210" y="298" font-size="13" class="m" text-anchor="start">edge function, 6 px</text><text x="560" y="298" font-size="13" class="mono" text-anchor="start">10 → 12</text><text x="750" y="298" font-size="13" class="mono" text-anchor="start">2</text><text x="830" y="298" font-size="13" class="mono" text-anchor="start">708</text><rect x="1000" y="286" width="52.96758104738154" height="14" rx="4" fill="var(--violet)"/><rect x="30" y="316" width="1140" height="34" rx="9" fill="var(--panel)" stroke="var(--line)"/><text x="50" y="338" font-size="14" class="mono b" text-anchor="start">cover</text><text x="210" y="338" font-size="13" class="m" text-anchor="start">×15 ×15, AND of 3 edges</text><text x="560" y="338" font-size="13" class="mono" text-anchor="start">12 → 4</text><text x="750" y="338" font-size="13" class="mono" text-anchor="start">2</text><text x="830" y="338" font-size="13" class="mono" text-anchor="start">708</text><rect x="1000" y="326" width="52.96758104738154" height="14" rx="4" fill="var(--violet)"/><rect x="30" y="356" width="1140" height="34" rx="9" fill="var(--panel)" stroke="var(--line)"/><text x="50" y="378" font-size="14" class="mono b" text-anchor="start">rop1</text><text x="210" y="378" font-size="13" class="m" text-anchor="start">cov, depth step s31</text><text x="560" y="378" font-size="13" class="mono" text-anchor="start">12 → 13</text><text x="750" y="378" font-size="13" class="mono" text-anchor="start">2</text><text x="830" y="378" font-size="13" class="mono" text-anchor="start">278</text><rect x="1000" y="366" width="20.798004987531172" height="14" rx="4" fill="var(--violet)"/><rect x="30" y="396" width="1140" height="34" rx="9" fill="var(--panel)" stroke="var(--line)"/><text x="50" y="418" font-size="14" class="mono b" text-anchor="start">rop2</text><text x="210" y="418" font-size="13" class="m" text-anchor="start">gated Z′ and C′ write</text><text x="560" y="418" font-size="13" class="mono" text-anchor="start">13 → 4</text><text x="750" y="418" font-size="13" class="mono" text-anchor="start">2</text><text x="830" y="418" font-size="13" class="mono" text-anchor="start">278</text><rect x="1000" y="406" width="20.798004987531172" height="14" rx="4" fill="var(--violet)"/><text x="40" y="458" font-size="12.5" class="m" text-anchor="start">eval + cover + rop run once per (triangle, row, 6-pixel group). rop skips groups the model reports as uncovered: 430 of 708 on this frame.</text></svg>