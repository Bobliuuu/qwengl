<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" role="img"><style>
:root{--bg:#fbfbfd;--panel:#ffffff;--soft:#eef0f9;--ink:#14172b;--mute:#5a6285;--line:#c9cde3;--teal:#0f9d8a;--violet:#6246ea;--amber:#c97a0a;--rose:#d1385c;--vfill:#ece8ff;--tfill:#dcf5f0;--afill:#fff0d6;--rfill:#ffe3ea}
@media (prefers-color-scheme:dark){:root{--bg:#0b0e1a;--panel:#12172b;--soft:#171d36;--ink:#e6e9ff;--mute:#9aa4cf;--line:#2b3252;--teal:#35d6c0;--violet:#9d86ff;--amber:#ffb454;--rose:#ff6b8b;--vfill:#1d1a3d;--tfill:#10312f;--afill:#33260f;--rfill:#3a1824}}
text{font-family:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;fill:var(--ink)}
.m{fill:var(--mute)}.b{font-weight:700}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre}
.flow{stroke-dasharray:7 6;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-13}}
.pulse{animation:pl 2.4s ease-in-out infinite}@keyframes pl{50%{opacity:.45}}
.rise{animation:rs 3.2s ease-in-out infinite}@keyframes rs{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.flow,.pulse,.rise{animation:none}}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--mute)"/></marker></defs><rect width="1200" height="420" rx="18" fill="var(--bg)"/><text x="40" y="40" font-size="22" class="b" text-anchor="start">The depth test and framebuffer write, as four ReLU layers</text><text x="40" y="62" font-size="13" class="m" text-anchor="start">Two programs: rop1 (layers 1–2) and rop2 (layers 3–4). Two pixels per run, 6 lanes each.</text><rect x="40" y="110" width="212" height="130" rx="12" fill="var(--afill)" stroke="var(--amber)" stroke-width="2" class=""/><text x="146.0" y="135" font-size="14" class="b" text-anchor="middle" fill="var(--amber)">in</text><text x="146.0" y="157" font-size="11" class="m" text-anchor="middle">s⁺  s⁻</text><text x="146.0" y="174" font-size="11" class="m" text-anchor="middle">Z  zn</text><text x="146.0" y="191" font-size="11" class="m" text-anchor="middle">C  cn</text><line x1="254" y1="175" x2="270" y2="175" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><rect x="272" y="110" width="212" height="130" rx="12" fill="var(--vfill)" stroke="var(--violet)" stroke-width="2" class=""/><text x="378.0" y="135" font-size="14" class="b" text-anchor="middle" fill="var(--violet)">L1</text><text x="378.0" y="157" font-size="11" class="m" text-anchor="middle">cov = relu(s⁺+s⁻)</text><text x="378.0" y="174" font-size="11" class="m" text-anchor="middle">u = relu(15·(Z−zn))</text><text x="378.0" y="191" font-size="11" class="m" text-anchor="middle">Z zn C cn pass</text><line x1="486" y1="175" x2="502" y2="175" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><rect x="504" y="110" width="212" height="130" rx="12" fill="var(--vfill)" stroke="var(--violet)" stroke-width="2" class=""/><text x="610.0" y="135" font-size="14" class="b" text-anchor="middle" fill="var(--violet)">L2</text><text x="610.0" y="157" font-size="11" class="m" text-anchor="middle">s31 = relu(15·u)</text><text x="610.0" y="174" font-size="11" class="m" text-anchor="middle">cov Z zn C cn pass</text><text x="610.0" y="191" font-size="11" class="m" text-anchor="middle">const 15 lane</text><line x1="718" y1="175" x2="734" y2="175" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><rect x="736" y="110" width="212" height="130" rx="12" fill="var(--vfill)" stroke="var(--violet)" stroke-width="2" class=""/><text x="842.0" y="135" font-size="14" class="b" text-anchor="middle" fill="var(--violet)">L3</text><text x="842.0" y="157" font-size="11" class="m" text-anchor="middle">g  = relu(Z−zn+s31+cov−62)</text><text x="842.0" y="174" font-size="11" class="m" text-anchor="middle">g₁ = relu(cn−C+…−62)</text><text x="842.0" y="191" font-size="11" class="m" text-anchor="middle">g₂ = relu(C−cn+…−62)</text><line x1="950" y1="175" x2="966" y2="175" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><rect x="968" y="110" width="212" height="130" rx="12" fill="var(--tfill)" stroke="var(--teal)" stroke-width="2" class=""/><text x="1074.0" y="135" font-size="14" class="b" text-anchor="middle" fill="var(--teal)">L4</text><text x="1074.0" y="157" font-size="11" class="m" text-anchor="middle">Z′ = relu(Z − g)</text><text x="1074.0" y="174" font-size="11" class="m" text-anchor="middle">C′ = relu(C + g₁ − g₂)</text><text x="40" y="280" font-size="13" class="m" text-anchor="start">s31 = 31 only when Z − zn ≥ 1 : two saturating ×15 steps turn a small integer into a hard 0 / 31.</text><text x="40" y="304" font-size="13" class="m" text-anchor="start">g and g₁−g₂ are gated by (s31 + cov − 62): both must be 31 for anything to pass, and 62 is built from a constant lane (15 × −4 − 2) because a bias can only reach −16.</text><text x="40" y="328" font-size="13" class="m" text-anchor="start">So the write is branch-free and multiplier-free: a conditional move made of saturating adds.</text><text x="40" y="372" font-size="12" class="m" text-anchor="start">Strict test: a fragment with equal depth does not overwrite. Z clears to 31, colour clears to 0 (background).</text></svg>