<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="100%" role="img"><style>
:root{--bg:#fbfbfd;--panel:#ffffff;--soft:#eef0f9;--ink:#14172b;--mute:#5a6285;--line:#c9cde3;--teal:#0f9d8a;--violet:#6246ea;--amber:#c97a0a;--rose:#d1385c;--vfill:#ece8ff;--tfill:#dcf5f0;--afill:#fff0d6;--rfill:#ffe3ea}
@media (prefers-color-scheme:dark){:root{--bg:#0b0e1a;--panel:#12172b;--soft:#171d36;--ink:#e6e9ff;--mute:#9aa4cf;--line:#2b3252;--teal:#35d6c0;--violet:#9d86ff;--amber:#ffb454;--rose:#ff6b8b;--vfill:#1d1a3d;--tfill:#10312f;--afill:#33260f;--rfill:#3a1824}}
text{font-family:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;fill:var(--ink)}
.m{fill:var(--mute)}.b{font-weight:700}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre}
.flow{stroke-dasharray:7 6;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-13}}
.pulse{animation:pl 2.4s ease-in-out infinite}@keyframes pl{50%{opacity:.45}}
.rise{animation:rs 3.2s ease-in-out infinite}@keyframes rs{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.flow,.pulse,.rise{animation:none}}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--mute)"/></marker></defs><rect width="1200" height="470" rx="18" fill="var(--bg)"/><text x="40" y="40" font-size="22" class="b" text-anchor="start">What runs where (the honest split)</text><text x="40" y="62" font-size="13" class="m" text-anchor="start">No pixel, vertex or edge value is ever computed on the host.</text><rect x="30" y="90" width="560" height="340" rx="16" fill="var(--tfill)" stroke="var(--teal)" stroke-width="2"/><text x="310" y="122" font-size="17" class="b" text-anchor="middle" fill="var(--teal)">inside Qwen3.5  (integer ReLU layers)</text><text x="60" y="158" font-size="14.5" class="" text-anchor="start">✅  vertex transform: 8 corners × (x, y, depth)</text><text x="60" y="192" font-size="14.5" class="" text-anchor="start">✅  guard-band clip flags</text><text x="60" y="226" font-size="14.5" class="" text-anchor="start">✅  edge functions, 6 pixels per run</text><text x="60" y="260" font-size="14.5" class="" text-anchor="start">✅  hard binarise + 3-edge AND, both windings</text><text x="60" y="294" font-size="14.5" class="" text-anchor="start">✅  depth test (Z − zn ≥ 1) and conditional write</text><text x="60" y="328" font-size="14.5" class="" text-anchor="start">✅  flat shading: 5 brightness levels × 6 hues</text><text x="60" y="362" font-size="14.5" class="" text-anchor="start">✅  every pixel, every depth value, every colour</text><rect x="610" y="90" width="560" height="340" rx="16" fill="var(--afill)" stroke="var(--amber)" stroke-width="2"/><text x="890" y="122" font-size="17" class="b" text-anchor="middle" fill="var(--amber)">on the host  (no pixel arithmetic)</text><text x="640" y="158" font-size="14.5" class="" text-anchor="start">🧰  quantise the rotation to a 3×3 int uniform</text><text x="640" y="192" font-size="14.5" class="" text-anchor="start">🧰  m = Rx × Ry and the object-space light Rᵀl</text><text x="640" y="226" font-size="14.5" class="" text-anchor="start">🧰  bounding-box tile binning from vertex outputs</text><text x="640" y="260" font-size="14.5" class="" text-anchor="start">🧰  gather / scatter of lanes between kernels</text><text x="640" y="294" font-size="14.5" class="" text-anchor="start">🧰  clear values: Z = 31, colour = 0 · draw order</text><text x="640" y="328" font-size="14.5" class="" text-anchor="start">🧰  skip raster ops the model reported as empty</text><text x="640" y="362" font-size="14.5" class="" text-anchor="start">🧰  argmax + append (free-running mode)</text><text x="40" y="456" font-size="13" class="m" text-anchor="start">Also not done: polygon clipping (guard-band check only) · interpolated depth (flat per face) · buffers live in host-held tokens between kernels.</text></svg>