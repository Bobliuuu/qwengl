<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" role="img"><style>
:root{--bg:#fbfbfd;--panel:#ffffff;--soft:#eef0f9;--ink:#14172b;--mute:#5a6285;--line:#c9cde3;--teal:#0f9d8a;--violet:#6246ea;--amber:#c97a0a;--rose:#d1385c;--vfill:#ece8ff;--tfill:#dcf5f0;--afill:#fff0d6;--rfill:#ffe3ea}
@media (prefers-color-scheme:dark){:root{--bg:#0b0e1a;--panel:#12172b;--soft:#171d36;--ink:#e6e9ff;--mute:#9aa4cf;--line:#2b3252;--teal:#35d6c0;--violet:#9d86ff;--amber:#ffb454;--rose:#ff6b8b;--vfill:#1d1a3d;--tfill:#10312f;--afill:#33260f;--rfill:#3a1824}}
text{font-family:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;fill:var(--ink)}
.m{fill:var(--mute)}.b{font-weight:700}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre}
.flow{stroke-dasharray:7 6;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-13}}
.pulse{animation:pl 2.4s ease-in-out infinite}@keyframes pl{50%{opacity:.45}}
.rise{animation:rs 3.2s ease-in-out infinite}@keyframes rs{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.flow,.pulse,.rise{animation:none}}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--mute)"/></marker></defs><rect width="1200" height="560" rx="18" fill="var(--bg)"/><text x="40" y="40" font-size="22" class="b" text-anchor="start">A GL-style API on top of the kernels</text><text x="40" y="62" font-size="13" class="m" text-anchor="start">Every call maps to host bookkeeping or to kernels that run inside Qwen3.5.</text><rect x="30" y="88" width="560" height="320" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/><text x="50" y="120" font-size="13" class="mono" text-anchor="start">gl = GL(backend)</text><text x="50" y="146" font-size="13" class="mono" text-anchor="start">gl.light((-1, -1, -2))               # glLight</text><text x="50" y="172" font-size="13" class="mono" text-anchor="start">gl.clear()                          # glClear(COLOR | DEPTH)</text><text x="50" y="198" font-size="13" class="mono" text-anchor="start"></text><text x="50" y="224" font-size="13" class="mono" text-anchor="start">gl.draw_elements(cube(),</text><text x="50" y="250" font-size="13" class="mono" text-anchor="start">    rotation=rot_matrix(a, b, c),</text><text x="50" y="276" font-size="13" class="mono" text-anchor="start">    translate=(0, 0, 0))            # glDrawElements</text><text x="50" y="302" font-size="13" class="mono" text-anchor="start">gl.draw_elements(octahedron(1), ...)    # same depth buffer</text><text x="50" y="328" font-size="13" class="mono" text-anchor="start">gl.draw_elements(pyramid(1), ...)</text><text x="50" y="354" font-size="13" class="mono" text-anchor="start"></text><text x="50" y="380" font-size="13" class="mono" text-anchor="start">img = gl.read_pixels()              # glReadPixels</text><rect x="640" y="88" width="520" height="32" rx="9" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.6"/><text x="656" y="109" font-size="13.5" class="b" text-anchor="start">uniform: rotation, light</text><text x="1144" y="109" font-size="12.5" class="b" text-anchor="end" fill="var(--amber)">host</text><rect x="640" y="128" width="520" height="32" rx="9" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.6"/><text x="656" y="149" font-size="13.5" class="b" text-anchor="start">vertex transform</text><text x="1144" y="149" font-size="12.5" class="b" text-anchor="end" fill="var(--teal)">in Qwen</text><rect x="640" y="168" width="520" height="32" rx="9" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.6"/><text x="656" y="189" font-size="13.5" class="b" text-anchor="start">guard-band clip</text><text x="1144" y="189" font-size="12.5" class="b" text-anchor="end" fill="var(--teal)">in Qwen</text><rect x="640" y="208" width="520" height="32" rx="9" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.6"/><text x="656" y="229" font-size="13.5" class="b" text-anchor="start">edge setup + evaluation</text><text x="1144" y="229" font-size="12.5" class="b" text-anchor="end" fill="var(--teal)">in Qwen</text><rect x="640" y="248" width="520" height="32" rx="9" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.6"/><text x="656" y="269" font-size="13.5" class="b" text-anchor="start">coverage (both windings)</text><text x="1144" y="269" font-size="12.5" class="b" text-anchor="end" fill="var(--teal)">in Qwen</text><rect x="640" y="288" width="520" height="32" rx="9" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.6"/><text x="656" y="309" font-size="13.5" class="b" text-anchor="start">depth test + write</text><text x="1144" y="309" font-size="12.5" class="b" text-anchor="end" fill="var(--teal)">in Qwen</text><rect x="640" y="328" width="520" height="32" rx="9" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.6"/><text x="656" y="349" font-size="13.5" class="b" text-anchor="start">flat shading, 5 levels</text><text x="1144" y="349" font-size="12.5" class="b" text-anchor="end" fill="var(--teal)">in Qwen</text><rect x="640" y="368" width="520" height="32" rx="9" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.6"/><text x="656" y="389" font-size="13.5" class="b" text-anchor="start">glReadPixels</text><text x="1144" y="389" font-size="12.5" class="b" text-anchor="end" fill="var(--amber)">host</text><text x="40" y="446" font-size="14" class="b" text-anchor="start">Supported:</text><text x="150" y="446" font-size="13" class="m" text-anchor="start">any triangle mesh with small-integer vertices · rotation + screen/depth translation · several draw calls with one depth buffer</text><text x="40" y="474" font-size="14" class="b" text-anchor="start">Built in:</text><text x="150" y="474" font-size="13" class="m" text-anchor="start">cube, octahedron, tetrahedron, pyramid (or pass your own Mesh(vertices, triangles))</text><text x="40" y="502" font-size="14" class="b" text-anchor="start" fill="var(--rose)">Not supported:</text><text x="150" y="502" font-size="13" class="m" text-anchor="start">perspective · shaders · textures · blending · dynamic meshes · polygon clipping · per-pixel depth interpolation</text></svg>