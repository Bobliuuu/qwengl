<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" role="img"><style>
:root{--bg:#fbfbfd;--panel:#ffffff;--soft:#eef0f9;--ink:#14172b;--mute:#5a6285;--line:#c9cde3;--teal:#0f9d8a;--violet:#6246ea;--amber:#c97a0a;--rose:#d1385c;--vfill:#ece8ff;--tfill:#dcf5f0;--afill:#fff0d6;--rfill:#ffe3ea}
@media (prefers-color-scheme:dark){:root{--bg:#0b0e1a;--panel:#12172b;--soft:#171d36;--ink:#e6e9ff;--mute:#9aa4cf;--line:#2b3252;--teal:#35d6c0;--violet:#9d86ff;--amber:#ffb454;--rose:#ff6b8b;--vfill:#1d1a3d;--tfill:#10312f;--afill:#33260f;--rfill:#3a1824}}
text{font-family:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;fill:var(--ink)}
.m{fill:var(--mute)}.b{font-weight:700}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre}
.flow{stroke-dasharray:7 6;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-13}}
.pulse{animation:pl 2.4s ease-in-out infinite}@keyframes pl{50%{opacity:.45}}
.rise{animation:rs 3.2s ease-in-out infinite}@keyframes rs{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.flow,.pulse,.rise{animation:none}}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--mute)"/></marker></defs><rect width="1200" height="520" rx="18" fill="var(--bg)"/><text x="40" y="40" font-size="22" class="b" text-anchor="start">Architecture: one kernel = one prompt</text><text x="40" y="62" font-size="13" class="m" text-anchor="start">The weights of a tiny integer network travel in the prompt. The model emits every output token itself.</text><rect x="30" y="100" width="210" height="150" rx="12" fill="var(--afill)" stroke="var(--amber)" stroke-width="2" class=""/><text x="135.0" y="125" font-size="15" class="b" text-anchor="middle" fill="var(--amber)">HOST</text><text x="135.0" y="147" font-size="12" class="m" text-anchor="middle">quantise rotation  (3×3 int)</text><text x="135.0" y="164" font-size="12" class="m" text-anchor="middle">bin triangles  (bbox)</text><text x="135.0" y="181" font-size="12" class="m" text-anchor="middle">gather / scatter lanes</text><text x="135.0" y="198" font-size="12" class="m" text-anchor="middle">clear buffers · draw order</text><text x="135.0" y="215" font-size="12" class="m" text-anchor="middle">argmax + append</text><rect x="30" y="290" width="210" height="120" rx="12" fill="var(--vfill)" stroke="var(--violet)" stroke-width="2" class=""/><text x="135.0" y="315" font-size="15" class="b" text-anchor="middle" fill="var(--violet)">kernel tables</text><text x="135.0" y="337" font-size="12" class="m" text-anchor="middle">stages.py</text><text x="135.0" y="354" font-size="12" class="m" text-anchor="middle">5-bit weights · ≤15 lanes</text><text x="135.0" y="371" font-size="12" class="m" text-anchor="middle">prompt = 1,056 tokens</text><text x="135.0" y="388" font-size="12" class="m" text-anchor="middle">1,024 CELL + 32 ACT</text><path d="M 135 290 L 135 254" fill="none" stroke="var(--violet)" stroke-width="2" class="flow" marker-end="url(#ar)"/><path d="M 244 175 L 330 175" fill="none" stroke="var(--amber)" stroke-width="2" class="flow" marker-end="url(#ar)"/><text x="287" y="160" font-size="12" class="b" text-anchor="middle" fill="var(--amber)">prompt</text><rect x="334" y="86" width="560" height="372" rx="16" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/><text x="614" y="112" font-size="15" class="b" text-anchor="middle">Qwen3.5-0.8B, with 20 chip layers appended</text><rect x="360" y="130" width="508" height="64" rx="12" fill="var(--soft)" stroke="var(--mute)" stroke-width="2" stroke-dasharray="6 5" class=""/><text x="614.0" y="155" font-size="15" class="b" text-anchor="middle" fill="var(--mute)">24 original Qwen layers</text><text x="614.0" y="177" font-size="12" class="m" text-anchor="middle">muted on chip tokens: they are the identity, so the fast path skips them (bit-identical)</text><rect x="360" y="222" width="92" height="46" rx="9" fill="var(--tfill)" stroke="var(--teal)" stroke-width="2"/><text x="406" y="250" font-size="12" class="b" text-anchor="middle" fill="var(--teal)">chip layer</text><rect x="464" y="222" width="92" height="46" rx="9" fill="var(--tfill)" stroke="var(--teal)" stroke-width="2"/><text x="510" y="250" font-size="12" class="b" text-anchor="middle" fill="var(--teal)">chip layer</text><rect x="568" y="222" width="92" height="46" rx="9" fill="var(--tfill)" stroke="var(--teal)" stroke-width="2"/><text x="614" y="250" font-size="12" class="b" text-anchor="middle" fill="var(--teal)">chip layer</text><rect x="672" y="222" width="92" height="46" rx="9" fill="var(--tfill)" stroke="var(--teal)" stroke-width="2"/><text x="718" y="250" font-size="12" class="b" text-anchor="middle" fill="var(--teal)">chip layer</text><rect x="776" y="222" width="92" height="46" rx="9" fill="var(--tfill)" stroke="var(--teal)" stroke-width="2"/><text x="822" y="250" font-size="12" class="b" text-anchor="middle" fill="var(--teal)">…</text><text x="614" y="296" font-size="12.5" class="m" text-anchor="middle">DeltaNet state = the weight array.  Writes: CELL tokens.  Reads: READ tokens.</text><rect x="360" y="316" width="160" height="112" rx="12" fill="var(--tfill)" stroke="var(--teal)" stroke-width="2" class=""/><text x="440.0" y="341" font-size="15" class="b" text-anchor="middle" fill="var(--teal)">weights</text><text x="440.0" y="363" font-size="12" class="m" text-anchor="middle">32×32 packed</text><text x="440.0" y="380" font-size="12" class="m" text-anchor="middle">layer 0 block</text><text x="440.0" y="397" font-size="12" class="m" text-anchor="middle">layer 1 block</text><rect x="540" y="316" width="160" height="112" rx="12" fill="var(--tfill)" stroke="var(--teal)" stroke-width="2" class=""/><text x="620.0" y="341" font-size="15" class="b" text-anchor="middle" fill="var(--teal)">multi-hot read</text><text x="620.0" y="363" font-size="12" class="m" text-anchor="middle">= exact sum</text><text x="620.0" y="380" font-size="12" class="m" text-anchor="middle">of selected rows</text><text x="620.0" y="397" font-size="12" class="m" text-anchor="middle">(adder tree)</text><rect x="720" y="316" width="148" height="112" rx="12" fill="var(--tfill)" stroke="var(--teal)" stroke-width="2" class=""/><text x="794.0" y="341" font-size="15" class="b" text-anchor="middle" fill="var(--teal)">relu + clamp</text><text x="794.0" y="363" font-size="12" class="m" text-anchor="middle">saturating</text><text x="794.0" y="380" font-size="12" class="m" text-anchor="middle">Horner fold</text><text x="794.0" y="397" font-size="12" class="m" text-anchor="middle">0..31</text><path d="M 520 372 L 536 372" fill="none" stroke="var(--mute)" stroke-width="2" marker-end="url(#ar)"/><path d="M 700 372 L 716 372" fill="none" stroke="var(--mute)" stroke-width="2" marker-end="url(#ar)"/><path d="M 872 372 L 926 372" fill="none" stroke="var(--teal)" stroke-width="2" class="flow" marker-end="url(#ar)"/><text x="899" y="360" font-size="12" class="b" text-anchor="middle" fill="var(--teal)">emits</text><rect x="930" y="316" width="240" height="112" rx="12" fill="var(--tfill)" stroke="var(--teal)" stroke-width="2" class=""/><text x="1050.0" y="341" font-size="14" class="b" text-anchor="middle" fill="var(--teal)">READ k · ACT row;y</text><text x="1050.0" y="363" font-size="11" class="m" text-anchor="middle">…then OUT tokens, then HALT</text><text x="1050.0" y="380" font-size="11" class="m" text-anchor="middle">65 tokens per depth-2 run</text><text x="1050.0" y="397" font-size="11" class="m" text-anchor="middle">(argmax, fed back)</text><path d="M 1050 430 L 1050 494 L 12 494 L 12 175 L 28 175" fill="none" stroke="var(--teal)" stroke-width="2" class="flow" marker-end="url(#ar)"/><text x="600" y="486" font-size="12.5" class="m" text-anchor="middle">decoded from the MODEL&#x27;s tokens, gathered by the host into the next stage&#x27;s input lanes</text></svg>